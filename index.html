<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CyberCar Launcher - Local Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f3ff;
            --warn: #ff8c00;
            --bg: #0a0a0a;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            /* Estructura de tu boceto: 3 columnas */
            grid-template-columns: 1fr 1.2fr 1fr;
            grid-template-rows: 1fr 80px; /* Fila inferior para tu barra de sistema */
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .panel {
            border: 2px solid var(--neon);
            border-radius: 20px;
            background: rgba(0, 243, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* PANEL IZQUIERDO: Navegación */
        #nav-panel { border-color: var(--neon); }

        /* PANEL CENTRAL: Velocímetro y Brújula (Tu diseño) */
        .gauge-container {
            text-align: center;
        }
        .speed-arc {
            width: 200px;
            height: 100px;
            border: 5px solid var(--neon);
            border-bottom: none;
            border-radius: 100px 100px 0 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 10px;
        }
        .speed-value { font-size: 3rem; text-shadow: 0 0 15px var(--neon); }

        /* PANEL DERECHO: Música Local */
        .music-controls button {
            background: none;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Orbitron';
        }

        /* BARRA INFERIOR (Tu diseño de trapecio) */
        .bottom-bar {
            grid-column: 1 / 4;
            background: var(--neon);
            color: black;
            clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        .icon-btn { font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="panel" id="nav-panel">
        <p>NAVEGACIÓN</p>
        <div style="font-size: 0.7rem; color: var(--neon)">GOOGLE MAPS MODE</div>
    </div>

    <div class="panel" style="border:none; background:none;">
        <div class="gauge-container">
            <div class="speed-arc">
                <div class="speed-value">00</div>
            </div>
            <div style="color:var(--warn)">KM/H</div>
        </div>
        
        <div style="margin-top: 30px; text-align: center;">
            <div style="border: 1px solid white; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
                N
            </div>
            <p id="fecha" style="font-size: 0.8rem;">11 MAY 2026</p>
        </div>
    </div>

    <div class="panel">
        <p>MÚSICA</p>
        <div id="track-name" style="font-size: 0.8rem; margin: 10px;">Selecciona archivos...</div>
        <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
        <div class="music-controls">
            <button onclick="document.getElementById('file-input').click()">📁 CARGAR</button><br>
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
        </div>
        <audio id="audio-player"></audio>
    </div>

    <div class="bottom-bar">
        <div class="icon-btn">🏠 HOME</div>
        <div class="icon-btn">⣿ APPS</div>
        <div class="icon-btn">⚙ SETTINGS</div>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const fileInput = document.getElementById('file-input');
        const trackName = document.getElementById('track-name');
        let playlist = [];
        let currentTrack = 0;

        fileInput.addEventListener('change', (e) => {
            playlist = Array.from(e.target.files);
            if (playlist.length > 0) playTrack(0);
        });

        function playTrack(index) {
            currentTrack = index;
            const file = playlist[index];
            trackName.innerText = file.name;
            audio.src = URL.createObjectURL(file);
            audio.play();
        }

        document.getElementById('play').onclick = () => audio.paused ? audio.play() : audio.pause();
        document.getElementById('next').onclick = () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            playTrack(currentTrack);
        };
    </script>
</body>
</html>
