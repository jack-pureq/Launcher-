<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCar Pro - Interfaz Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <style>
        :root { --neon: #00f3ff; --purple: #a020f0; --bg: #000000; }
        body {
            background: var(--bg); color: white; font-family: 'Orbitron', sans-serif;
            margin: 0; height: 100vh; display: grid;
            grid-template-columns: 1fr 1.5fr 1fr; grid-template-rows: 1fr 100px;
            gap: 20px; padding: 20px; overflow: hidden;
        }

        /* Estilo de Contenedores de la Imagen */
        .card {
            border: 2px solid #333; border-radius: 30px;
            background: rgba(20, 20, 20, 0.8); position: relative;
            display: flex; flex-direction: column; padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        /* Bordes Neón Curvos (Como en tu imagen) */
        .card::before {
            content: ""; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 30px; border: 2px solid transparent;
            border-left: 4px solid var(--neon); border-bottom: 4px solid var(--neon);
            pointer-events: none;
        }

        .right-card::before {
            border-left: none; border-right: 4px solid var(--purple); border-top: 4px solid var(--purple);
        }

        /* VELOCÍMETRO CIRCULAR */
        .speed-gauge {
            width: 300px; height: 150px; position: relative;
            border-top: 6px solid var(--neon); border-left: 6px solid var(--neon);
            border-right: 6px solid var(--purple); border-radius: 300px 300px 0 0;
            display: flex; align-items: center; justify-content: center;
            margin-top: 20px;
        }

        .speed-number { font-size: 5.5rem; font-family: 'Share Tech Mono'; text-shadow: 0 0 30px white; }

        /* MAPA */
        #map { width: 100%; height: 100%; border-radius: 20px; filter: brightness(0.6) contrast(1.2); }

        /* BARRA INFERIOR */
        .dock {
            grid-column: 1 / 4; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(0deg, rgba(0,243,255,0.2) 0%, transparent 100%);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            gap: 80px;
        }
        .icon { font-size: 1.8rem; cursor: pointer; color: #aaa; transition: 0.3s; }
        .icon:hover { color: var(--neon); transform: scale(1.2); }

    </style>
</head>
<body>

    <div class="card">
        <div style="margin-bottom: 10px; font-size: 0.9rem; text-align: center;">Navegación</div>
        <div id="map"></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-size: 1.2rem; margin-bottom: 10px;">Velocímetro</div>
        <div class="speed-gauge">
            <div class="speed-number" id="real-speed">00</div>
        </div>
        <div style="color: var(--neon); letter-spacing: 5px; margin-top: 10px;">KM/H</div>
        <div id="clock" style="margin-top: 20px; font-size: 1.5rem; font-family: 'Share Tech Mono';">12:00:00</div>
    </div>

    <div class="card right-card">
        <div style="text-align: center; font-size: 0.9rem;">Reproductor de música</div>
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
            <div style="width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--purple); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--purple);">
                <span style="font-size: 3rem;">🎵</span>
            </div>
        </div>
        <div style="display: flex; justify-content: space-around; padding: 10px;">
            <span class="icon">⏮</span>
            <span class="icon" id="play-trigger">▶</span>
            <span class="icon">⏭</span>
        </div>
    </div>

    <div class="dock">
        <div class="icon">🏠</div>
        <div class="icon">⣿</div>
        <div class="icon">⚙</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script>
        // 1. RELOJ
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // 2. MAPA CON BUSCADOR
        var map = L.map('map', {zoomControl: false}).setView([-16.409, -71.537], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.Control.geocoder({ defaultMarkGeocode: true }).addTo(map);

        // 3. VELOCÍMETRO GPS REAL (Requiere Permisos)
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                // Convertir metros/segundo a KM/H
                let speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
                document.getElementById('real-speed').innerText = speed.toString().padStart(2, '0');
            }, (err) => {
                console.warn("Error GPS: ", err);
            }, { enableHighAccuracy: true });
        } else {
            alert("El GPS no está disponible en este dispositivo.");
        }
    </script>
</body>
</html>
