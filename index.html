<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Launcher Futurista</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-orange: #ff8c00;
            --bg-dark: #050505;
            --glass: rgba(0, 243, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Contenedor Principal (Horizontal) */
        .launcher-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 20px;
            width: 95vw;
            height: 90vh;
        }

        /* Estilo de los Paneles */
        .panel {
            background: var(--glass);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Efecto de borde cortado (Futurista) */
        .panel::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px;
            width: 20px; height: 20px;
            border-top: 4px solid var(--neon-orange);
            border-left: 4px solid var(--neon-orange);
        }

        /* Velocímetro e Info */
        .stat-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 4rem;
            text-shadow: 0 0 20px var(--neon-blue);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--neon-orange);
            letter-spacing: 2px;
        }

        /* Botones de Acción */
        .btn-action {
            width: 80%;
            padding: 15px;
            border: 1px solid var(--neon-blue);
            background: transparent;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .btn-action:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Reloj Central */
        #clock {
            font-size: 5rem;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="launcher-container">
        <!-- Panel Izquierdo: Telemetría -->
        <div class="panel">
            <div>
                <div class="stat-label">VELOCIDAD</div>
                <div class="stat-value">0</div>
                <div class="stat-label">KM/H</div>
            </div>
            <div>
                <div class="stat-label">DISTANCIA TOTAL</div>
                <div class="stat-value" style="font-size: 1.5rem;">180,000 KM</div>
            </div>
        </div>

        <!-- Panel Central: Tiempo y Estado -->
        <div class="panel" style="border-color: var(--neon-orange);">
            <div class="stat-label">SISTEMA ACTIVO</div>
            <div id="clock">00:00</div>
            <div class="stat-label">AREQUIPA - PERÚ</div>
        </div>

        <!-- Panel Derecho: Accesos Rápidos -->
        <div class="panel">
            <button class="btn-action">MAPAS</button>
            <button class="btn-action">MÚSICA</button>
            <button class="btn-action" style="border-color: var(--neon-orange);">GT PUREQ</button>
        </div>
    </div>

    <script>
        // Reloj Simple
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
